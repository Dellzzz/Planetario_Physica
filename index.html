<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04050d" />
  <title>Planetario Virtual 3D - Sistema Solar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Import map: carrega Three.js e OrbitControls via CDN (ES Modules).
       Funciona em qualquer servidor web e no GitHub Pages. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud-root"></div>

  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Gerando o cosmos...</div>
  </div>

  <script>
    // Rede de seguranca: se o app nao iniciar (ex.: algum arquivo .js nao foi
    // enviado ao servidor), mostra um aviso em vez de ficar em "loading" infinito.
    function showLoaderError(msg) {
      var l = document.getElementById('loader');
      if (!l) return;
      l.classList.remove('hidden');
      l.innerHTML = '<div style="max-width:360px;text-align:center;font-family:Poppins,sans-serif;color:#ffd6d6;padding:0 22px;line-height:1.55">'
        + '<div style="font-size:36px;margin-bottom:10px">&#9888;</div>' + msg
        + '<div style="opacity:.65;font-size:12px;margin-top:14px">Abra o Console (tecla F12) para ver o erro exato.</div></div>';
    }
    window.__showLoaderError = showLoaderError;
    // erro ao carregar um modulo/recurso (ex.: 404 de um arquivo .js)
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target.tagName === 'SCRIPT') {
        showLoaderError('Falha ao carregar um modulo JavaScript (arquivo ausente ou caminho errado). Verifique se TODOS os arquivos foram enviados ao servidor.');
      }
    }, true);
    // ultimo recurso: nao iniciou em 10s
    setTimeout(function () {
      if (!window.__planetarioReady) {
        showLoaderError('Nao foi possivel iniciar. Confira se TODOS os arquivos das pastas <b>js/</b> e <b>objects/</b> foram enviados (inclusive os mais novos, como <b>objects/diagram.js</b>).');
      }
    }, 10000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
